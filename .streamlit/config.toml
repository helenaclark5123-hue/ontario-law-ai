[browser]
gatherUsageStats = false

# Serve the photos in static/ at app/static/...
[server]
enableStaticServing = true

# Dark navy, with Canadian flag red for buttons and links.
[theme]
base = "dark"
primaryColor = "#D52B1E"
backgroundColor = "#0B1424"
secondaryBackgroundColor = "#14223A"
textColor = "#E6EBF2"
font = "sans serif"
